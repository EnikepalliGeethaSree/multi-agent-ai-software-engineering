llm:
  provider: groq
  model: openai/gpt-oss-20b
  temperature: 0.0
  max_tokens: 2048
  seed: 42
  base_url: null
  api_key_env: null
  requests_per_minute: null
  tokens_per_minute: null
  max_retries: 5
  timeout_s: 120.0
  json_mode: true
  extra_params: {}
ingestion:
  max_zip_bytes: 104857600
  max_uncompressed_bytes: 524288000
  max_files: 20000
  max_file_bytes: 2097152
  include_extensions:
  - .py
  - .md
  - .rst
  - .txt
  - .yaml
  - .yml
  - .json
  - .toml
  - .cfg
  - .ini
  ignore_dirs:
  - .git
  - .venv
  - venv
  - env
  - __pycache__
  - node_modules
  - .idea
  - .vscode
  - dist
  - build
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  workspace_dir: data/workspaces
rag:
  enabled: true
  vector_store: chroma
  persist_dir: data/chroma
  embedding_model: hashing
  top_k: 6
  guideline_k: 2
  structural_context: true
  max_context_chars: 12000
review:
  mode: full
  min_confidence: 0.3
  require_llm_evidence: true
  max_unit_lines: 200
  max_units: 200
  include_info: true
  llm_triage_static: true
  scope_slack: 3
  include_tests: false
  concurrency: 4
datasets:
  root: capstone-datasets
  cache_dir: data/cache
