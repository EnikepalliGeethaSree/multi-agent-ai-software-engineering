llm:
  provider: groq
  model: openai/gpt-oss-120b
  temperature: 0.0
  max_tokens: 4096
  seed: 42
  base_url: null
  api_key_env: null
  requests_per_minute: 1000
  tokens_per_minute: 250000
  requests_per_day: null
  tokens_per_day: null
  max_input_tokens: null
  context_window: null
  max_retries: 5
  timeout_s: 120.0
  json_mode: true
  extra_params: {}
  max_total_tokens: 11000000
  max_estimated_cost_usd: 4.5
  input_price_per_1m_tokens_usd: 0.15
  output_price_per_1m_tokens_usd: 0.6
  allow_uncapped: false
  base_backoff_s: 2.0
  response_cache: true
  response_cache_dir: data/cache/llm_responses
ingestion:
  max_zip_bytes: 104857600
  max_uncompressed_bytes: 524288000
  max_files: 20000
  max_file_bytes: 2097152
  include_extensions:
  - .py
  - .md
  - .rst
  - .txt
  - .yaml
  - .yml
  - .json
  - .toml
  - .cfg
  - .ini
  ignore_dirs:
  - .git
  - .venv
  - venv
  - env
  - __pycache__
  - node_modules
  - .idea
  - .vscode
  - dist
  - build
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  workspace_dir: data/workspaces
rag:
  enabled: true
  vector_store: chroma
  persist_dir: data/chroma
  embedding_model: hashing
  top_k: 6
  guideline_k: 2
  structural_context: true
  max_context_chars: 8000
review:
  mode: full
  min_confidence: 0.3
  require_llm_evidence: true
  max_unit_lines: 200
  max_units: 220
  include_info: true
  llm_triage_static: true
  scope_slack: 3
  include_tests: false
  concurrency: 2
  type_check: false
  drop_vague: true
  suggest_fixes: true
  max_llm_fixes: 8
  max_impact_checks: 15
  unit_cache: false
  analysis_cache: false
  cache_dir: data/cache
  cache_ttl_hours: 168
  resume_ttl_hours: 72
datasets:
  root: capstone-datasets
  cache_dir: data/cache
classifier:
  enabled: false
  model_dir: null
  mode: prioritize
  threshold: null
bugs:
  max_units: 12
  max_candidates: 40
  candidate_lines: 30
  max_prompt_chars: 40000
  retrieval_k: 20
  require_trigger: true
