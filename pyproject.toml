[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marl-agents"
version = "0.1.0"
description = "Multi-Agent AI Assistant for Software Engineering Solutions (B.Tech capstone, team 23UG082)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "tzdata; sys_platform == 'win32'",  # Gemini's daily quotas reset at midnight Pacific
]

[project.optional-dependencies]
# Static analysis used by the Code Review Agent (run as subprocess on files, never executing them)
analysis = ["ruff>=0.5", "radon>=6.0", "mypy>=1.10"]
# RAG: embeddings + vector store
rag = ["chromadb>=0.5", "sentence-transformers>=3.0"]
# LLM providers + LangChain/LangGraph
llm = ["langchain-core>=0.3", "langgraph>=0.2", "openai>=1.40", "google-genai>=0.3"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
reports = ["jinja2>=3.1", "markdown>=3.6", "reportlab>=4.2"]
eval = ["datasets>=2.20", "nltk>=3.8", "rouge-score>=0.1.2", "scikit-learn>=1.4", "coverage>=7.5"]
# Fine-tuning the change classifier (never needed to run a review without one)
train = ["torch>=2.2", "transformers>=4.40", "peft>=0.11", "accelerate>=0.30", "scikit-learn>=1.4"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "radon>=6.0", "types-PyYAML", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Prompts and RAG guidance are read at runtime via importlib.resources; ship them in the wheel.
marl_agents = ["**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["capstone-datasets", "data", "PPT", "tests/fixtures", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PTH", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH", "E501"]
".claude/hooks/**" = ["S603"]
# Seeded random is used for reproducible sampling and bootstrap, not for security.
"src/marl_agents/evaluation/**" = ["S311"]
"src/marl_agents/training/**" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "google.*", "reportlab.*", "ruff.*", "radon.*", "chromadb.*", "sklearn.*", "peft.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".*", "data", "capstone-datasets"]
addopts = "-ra -m 'not dataset and not llm'"
markers = [
    "dataset: needs the real capstone-datasets/ folder",
    "llm: calls a real (paid/remote) LLM provider",
]
